# Canonical structural materials (placeholders; cite sources per entry).
# Fusion-aligned set: includes high-temperature alloys and shielding options.

materials:
  Al2219-T87:
    description: "Aerospace-grade Al–Cu alloy for cryogenic and high-temperature structures; used in propellant tanks and pressure vessels."
    density_kg_per_m3: 2840
    elastic_modulus_GPa: 73
    poisson_ratio: 0.33
    yield_strength_MPa: 370
    ultimate_strength_MPa: 470
    elongation_percent: 11
    shear_strength_MPa: 285
    fatigue_strength_MPa: 96
    thermal_conductivity_W_mK: 120
    specific_heat_kJ_per_kgK: 0.88
    coeff_thermal_expansion_per_K: 23.2e-6
    electrical_conductivity_percent_IACS: 34
    melting_range_C: [510, 650]
    service_temperature_C_max: 150
    cryogenic_notes:
      - "Retains or slightly increases strength at 77 K; used in LOX/LH₂ tanks."
    temperature_derating:
      reference: "Short-time tensile data"
      values:
        - { temp_C: 25, yield_strength_MPa: 370 }
        - { temp_C: 100, yield_strength_MPa: 345 }
        - { temp_C: 150, yield_strength_MPa: 320 }
        - { temp_C: 200, yield_strength_MPa: 290 }
        - { temp_C: 300, yield_strength_MPa: 220 }
    composition_wt_percent:
      Cu: 6.3
      Mn: 0.3
      Fe: 0.2
      Si: 0.2
      Ti: 0.06
      V: 0.1
      Zr: 0.1
      Al: "balance"
    citations:
      - "MIL-HDBK-5J (MMPDS-01), U.S. Dept. of Defense / FAA, 2003."
      - "ASM Handbook Vol. 2, Properties and Selection: Nonferrous Alloys, ASM Intl., 1990."
      - "MatWeb: Aluminum 2219-T87, https://www.matweb.com/search/DataSheet.aspx?MatGUID=ab2d367fd59b4b8d8a63d8a1db3a2f1f."
      - "NASA SP-8007, Buckling of Thin-Walled Cylinders, NASA Langley, 1965."
      - "NASA MSFC-SPEC-522, Mechanical Properties of 2219-T87 Aluminum Alloy Sheet and Plate at Cryogenic Temperatures, 1968."



# Structure design targets, safety factors, and layout policy.
# All geometry values are PLACEHOLDERS — to be refined as hull volume,
# population, and subsystem mass budgets are established.
#
# Gravity design decision:
#   Habitat rings rotate to generate centrifugal pseudo-gravity in life support zones.
#   Fusion thrust provides propulsion only — not used as primary gravity source.

# --- Placeholder hull geometry -------------------------------------------
hull_geometry:
  outer_radius_m: 100.0         # placeholder — refine from habitat volume analysis
  skin_thickness_mm: 15.0       # placeholder — refine from hull_stress analysis
  overall_length_m: null        # TBD — drives stringer/ring count and total mass
  design_internal_pressure_kPa: 101.325   # 1 atm standard cabin pressure
  notes:
    - "Radius chosen to give ~3 rpm for 1 g centrifugal at the ring wall (ω = √(g/r))"
    - "TODO: iterate radius once habitat volume per crew is established"

# --- Rotating ring geometry ----------------------------------------------
habitat_ring:
  ring_radius_m: 100.0          # placeholder — same as hull outer radius for now
  target_gravity_g: 1.0         # fraction of standard gravity at ring wall
  target_rpm_max: 3.0           # upper tolerance; above ~3-6 rpm causes motion sickness
  notes:
    - "TODO: verify rpm tolerance against NASA-STD-3001 Vol 1 human factors limits"
    - "TODO: refine ring radius once deck layout and room heights are fixed"

# --- Propulsion / thrust load --------------------------------------------
propulsion:
  design_thrust_kN: 500.0       # placeholder — theoretical fusion drive; no model yet
  drive_type: "fusion_continuous"
  notes:
    - "Thrust used for axial hull stress calculation only — not gravity source"
    - "TODO: replace with THRUM-derived thrust figure when propulsion model exists"
    - "TODO: cite fusion drive reference (e.g., Project Longshot, VISTA ICF study)"

# --- Safety factors ------------------------------------------------------
# Defaults from NASA-STD-5001B Table 1 (metallic crewed spacecraft structure).
# TODO: verify each factor against your chosen design standard and material.
# TODO: review ECSS-E-ST-32-10C for ESA equivalents if applicable.
safety_factors:
  yield: 1.25
  ultimate: 1.50
  buckling: 1.50        # applied to critical load; separate knockdown factors (KDF) also apply
  fatigue: 4.0          # safe-life design for crewed structure
  joints_efficiency_min: 0.85   # conservative default; verify against joint design
  citations:
    - "NASA-STD-5001B, Structural Design and Test Factors of Safety for Spaceflight Hardware (2016), Table 1"
    - "TODO: verify buckling KDF against NASA SP-8007 (General Instability of Cylinders)"
    - "TODO: verify fatigue factor against your crack-growth / safe-life methodology"

